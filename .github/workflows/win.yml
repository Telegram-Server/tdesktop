name: Windows.

# DarkMoon Windows build, manual runs only.
# Runs on a WarpBuild 16-core / 64GB Windows Server 2022 runner (billed per
# minute). WarpBuild's cache service doesn't support Windows, so actions/cache
# here goes through the GitHub cache.
#
# Required repository secrets: TG_API_ID, TG_API_HASH.

on:
  workflow_dispatch:
    inputs:
      enable_autoupdate:
        description: "Enable auto-update (off by default; when on, the client checks the official update sources and accepts official-signed updates)"
        type: boolean
        default: false
      enable_lto:
        description: "Enable LTO (on by default; turning it off is slower at this code size)"
        type: boolean
        default: true

jobs:

  windows:
    name: Windows
    runs-on: warp-windows-latest-x64-16x

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v5
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "release-lto" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      # This job selects the v143 14.44 toolset. Install the matching ATL
      # package so a cold dependency cache can build breakpad's dump_syms
      # instead of relying on a cached binary.
      - name: Visual Studio ATL component.
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          if (-not (Test-Path $vswhere) -or -not (Test-Path $setup)) {
            throw "Visual Studio Installer is incomplete at $installer."
          }

          $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
          $path = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
          if (-not $path) {
            # The WarpBuild Windows Server 2022 image only has VS 2022,
            # whose 17.14 main toolset is 14.44 with the plain ATL component.
            $toolsComponent = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
            $atlComponent = 'Microsoft.VisualStudio.Component.VC.ATL'
            $path = @(& $vswhere -latest -products '*' -version '[17.14,18.0)' -requires $toolsComponent -property installationPath)[0]
          }
          if (-not $path) {
            & $vswhere -all -products '*' -format text `
              | Select-String 'displayName|installationVersion|installationPath'
            throw "No Visual Studio instance provides the 14.44 toolset."
          }

          $toolset = Get-ChildItem (Join-Path $path 'VC\Tools\MSVC') -Directory `
            | Where-Object { $_.Name -like '14.44.*' } `
            | Sort-Object Name -Descending `
            | Select-Object -First 1
          if (-not $toolset) {
            throw "The selected Visual Studio instance has no 14.44 toolset."
          }
          $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
          if (Test-Path $header) {
            Write-Host "ATL is already installed for $($toolset.Name)."
            exit 0
          }

          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            'modify',
            '--installPath', "`"$path`"",
            '--add', $atlComponent,
            '--quiet', '--norestart', '--nocache'
          )
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Visual Studio Installer exited with $($process.ExitCode)."
          }
          if (-not (Test-Path $header)) {
            throw "$atlComponent completed without installing $header."
          }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: "14.44"

      - name: Verify Visual Studio ATL component.
        shell: pwsh
        run: |
          $atlInclude = Join-Path $env:VCToolsInstallDir 'atlmfc\include'
          $header = Join-Path $atlInclude 'atlbase.h'
          if (-not (Test-Path $header)) {
            throw "The selected toolset has no ATL header at $header."
          }
          if (($env:INCLUDE -split ';') -notcontains $atlInclude) {
            throw "The selected toolset did not add $atlInclude to INCLUDE."
          }

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Read configuration.
        shell: bash
        env:
          TDESKTOP_API_ID: ${{ secrets.TG_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TDESKTOP_API_ID" ] || [ -z "$TDESKTOP_API_HASH" ]; then
            echo "::error::Set TG_API_ID and TG_API_HASH repository secrets."
            exit 1
          fi
          echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_ID=$TDESKTOP_API_ID -D TDESKTOP_API_HASH=$TDESKTOP_API_HASH" >> $GITHUB_ENV

          ARTIFACT_NAME="DarkMoon x64"
          if [ "${{ inputs.enable_autoupdate }}" = "true" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} autoupdate"
          fi
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

      # Same pruning as upstream canary.yml: tdesktop_rust/out/src/wallet_engine
      # holds the UniFFI-generated wallet_engine.cpp the app compiles, and the
      # tlottie / wallet-engine checkouts are the sources the tdesktop_rust
      # stage rebuilds from, so all of them must survive.
      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/src/wallet_engine/*' -o '(' '(' -path '*/tlottie/*' -o -path '*/wallet-engine/*' ')' ! -path '*/target/*' ')' ')' -type f ')' -o '(' -empty ! -path '*/tlottie/*' ! -path '*/wallet-engine/*' ')' ')' -delete

      # Save the caches right after preparing the libraries, so a failed
      # app build doesn't throw away the dependency build that preceded it.
      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Save Libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save Qt cache.
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-qt.outputs.cache-primary-key }}

      - name: Telegram Desktop build.
        env:
          # /CGTHREADS raises MSVC's LTCG code-generation parallelism from the
          # default 4 to its hard maximum of 8 (the linker rejects higher).
          # Injected via the LINK env var link.exe reads, so no CMake flag is
          # overridden. Only set when LTO is on, otherwise link.exe warns.
          LINK: ${{ inputs.enable_lto && '/CGTHREADS:8' || '' }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D DESKTOP_APP_ENABLE_LTO=${{ inputs.enable_lto && 'ON' || 'OFF' }} ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=${{ inputs.enable_autoupdate && 'OFF' || 'ON' }} ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release --parallel

      - name: Move artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\Telegram.exe artifact\
          if exist %OUT%\Updater.exe move %OUT%\Updater.exe artifact\

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          retention-days: 7
